name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: fmt
        run: gofmt -w . && git diff --exit-code

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -v ./...

      - name: coverage
        run: |
          go test -coverprofile=coverage.out ./cli
          out="$(go tool cover -func=coverage.out)"
          echo "$out"
          total="$(echo "$out" | awk '/^total:/ {print $3}' | tr -d '%')"
          if [ "$total" != "100.0" ]; then
            echo "coverage is ${total}%, want 100.0%"
            exit 1
          fi
